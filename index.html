<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exchange Rate</title>
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="main min-vh-100 bg-dark">
      <header
        class="header bg-black d-flex justify-content-around align-items-center p-3"
      >
        <img
          src="https://static.vecteezy.com/system/resources/thumbnails/003/314/414/small/cute-british-shorthair-cat-kitten-isolated-on-gray-brown-background-photo.jpg"
          alt="cat"
          class="img rounded-circle"
        />
        <h1 class="headTitle text-warning fs-2">Cat Converter</h1>
      </header>
      <section
        class="mainSection d-flex justify-content-center align-items-center"
      >
        <section
          class="currencyConverter container bg-success w-50 h-75 rounded p-4"
        >
          <p class="text-warning fw-bold fs-3">Amount</p>
          <form class="form d-flex flex-column align-items-center gap-4">
            <div class="input-group">
              <input
                type="number"
                class="form-control"
                placeholder="1 By Default"
                min="1"
              />

              <button type="button" class="swapBtn btn btn-warning">
                Swap
              </button>
            </div>
            <div class="input-group">
              <img class="firstFlag bg-white" src="" alt="flag" />
              <select
                class="form-select currencies fromCurrency w-75"
                aria-label="From currency"
              ></select>
            </div>
            <div class="input-group">
              <img class="secondFlag bg-white" src="" alt="flag" />

              <select
                class="form-select currencies toCurrency w-75"
                aria-label="To currency"
              ></select>
            </div>

            <button type="submit" class="btn btn-dark w-75">Convert</button>

            <h2 class="result fw-bold"></h2>
          </form>
        </section>
      </section>
    </main>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
